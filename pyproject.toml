[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "squarepeg"
version = "0.2.0"
description = "Exact computational laboratory for the inscribed square problem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "sympy>=1.12",
    "hypothesis>=6.90",
]

[project.scripts]
squarepeg-benchmark = "squarepeg.benchmarks.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "fast: quick unit tests — tier 1 new-directive gate (default dev)",
    "slow: tests that may take seconds",
    "exhaustive: large corpus or multi-minute checks",
    "audit: manifest and frozen snapshot consistency — tier 2 (~seconds)",
    "deep: heavy directive audits — tier 3 sampled regression (~hours)",
    "milestone: full D042–D061 gate — tier 4 overnight before tag",
]

[tool.hypothesis]
max_examples = 25
