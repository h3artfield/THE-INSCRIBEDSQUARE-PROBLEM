<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100">
  <defs>
    <style>
      .title { font: bold 16px sans-serif; fill: #1a1a2e; }
      .label { font: 12px sans-serif; fill: #333; }
      .status-proved { fill: #2d6a4f; font: bold 11px sans-serif; }
      .status-cond { fill: #b08900; font: bold 11px sans-serif; }
      .status-open { fill: #9d0208; font: bold 11px sans-serif; }
      .panel { fill: #fafafa; stroke: #ccc; stroke-width: 1; }
      .lobe { fill: none; stroke-width: 2; }
      .outer { stroke: #1d3557; }
      .inner { stroke: #457b9d; }
      .corridor { stroke: #e63946; stroke-dasharray: 6 4; }
      .window { fill: #ffd166; fill-opacity: 0.5; stroke: #f4a261; }
      .rhombus { fill: none; stroke: #6a4c93; stroke-width: 2; }
      .square { fill: none; stroke: #2d6a4f; stroke-width: 2.5; }
      .arrow { stroke: #333; fill: #333; marker-end: url(#arr); }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z"/>
    </marker>
  </defs>

  <!-- Panel A -->
  <rect class="panel" x="20" y="20" width="560" height="410" rx="8"/>
  <text class="title" x="40" y="50">A  Nested lobe packet</text>
  <text class="status-proved" x="40" y="72">PROVED: same-sign nesting + windows</text>
  <circle cx="300" cy="240" r="140" class="lobe outer"/>
  <circle cx="300" cy="240" r="95" class="lobe inner"/>
  <circle cx="300" cy="240" r="55" class="lobe inner"/>
  <path d="M300,100 L300,60" class="corridor"/>
  <path d="M440,240 L480,240" class="corridor"/>
  <path d="M300,380 L300,420" class="corridor"/>
  <rect class="window" x="285" y="115" width="30" height="25" transform="rotate(0 300 240)"/>
  <rect class="window" x="365" y="228" width="25" height="30"/>
  <rect class="window" x="285" y="330" width="30" height="25"/>
  <rect class="window" x="210" y="228" width="25" height="30"/>
  <text class="label" x="40" y="400">L? ? L? ? L?; four cyclic windows J?&J?</text>

  <!-- Panel B -->
  <rect class="panel" x="620" y="20" width="560" height="410" rx="8"/>
  <text class="title" x="640" y="50">B  Failed eccentric example</text>
  <text class="status-open" x="640" y="72">EXCLUDED: K = a/b ? </text>
  <ellipse cx="900" cy="240" rx="180" ry="25" class="lobe outer"/>
  <ellipse cx="900" cy="240" rx="120" ry="18" class="lobe inner"/>
  <text class="label" x="640" y="400">Thin ellipses: nesting heuristics pass, ANNULAR_GRAPH fails (K bound)</text>
  <text class="label" x="640" y="420">Directive 020 falsification family</text>

  <!-- Panel C -->
  <rect class="panel" x="20" y="470" width="560" height="410" rx="8"/>
  <text class="title" x="40" y="500">C  Reference annular model ?_ref</text>
  <text class="status-proved" x="40" y="522">PROVED: T039 cyclic-odd component</text>
  <circle cx="300" cy="690" r="130" class="lobe outer"/>
  <circle cx="300" cy="690" r="58" class="lobe inner"/>
  <polygon class="rhombus" points="300,560 380,690 300,820 220,690"/>
  <text class="label" x="430" y="680">?_cyc</text>
  <path class="arrow" d="M420,650 L460,630"/>
  <path class="arrow" d="M460,730 L420,710"/>
  <text class="label" x="40" y="850">Star-annular radial graphs; cyclic relabeling (w?=1)</text>

  <!-- Panel D -->
  <rect class="panel" x="620" y="470" width="560" height="410" rx="8"/>
  <text class="title" x="640" y="500">D  Rhombus ? square</text>
  <text class="status-proved" x="640" y="522">PROVED: D(?u) = D(u); D=0 ? square</text>
  <text class="status-cond" x="640" y="542">CONDITIONAL: packet-scale only (T036-N1-ANN)</text>
  <polygon class="rhombus" points="760,620 820,690 760,760 700,690"/>
  <polygon class="square" points="980,620 1050,690 980,760 910,690"/>
  <path class="arrow" d="M850,690 L890,690"/>
  <text class="label" x="720" y="800">Rhombus family: diagonal defect changes sign</text>
  <text class="label" x="720" y="820">D crosses 0 ? nondegenerate square</text>
  <text class="status-open" x="720" y="850">OPEN: macroscopic limit if r_n to 0 (T036-N2/N3)</text>

  <!-- Panel E -->
  <rect class="panel" x="120" y="920" width="960" height="160" rx="8"/>
  <text class="title" x="140" y="950">E - Scale escape and coherent tower</text>
  <text class="status-open" x="140" y="972">CONJECTURAL: T036-N3-ANN not proved</text>
  <circle cx="350" cy="1020" r="50" class="lobe outer"/>
  <circle cx="350" cy="1020" r="30" class="lobe inner"/>
  <circle cx="350" cy="1020" r="12" class="lobe inner"/>
  <circle cx="350" cy="1020" r="3" fill="#9d0208"/>
  <text class="label" x="320" y="1045" font-size="10">c_inf</text>
  <rect class="window" x="395" y="995" width="15" height="15"/>
  <text class="label" x="420" y="1005" font-size="10">fixed r_1</text>
  <polygon class="square" points="580,1000 610,1030 580,1060 550,1030" opacity="0.4"/>
  <text class="label" x="530" y="1075" font-size="10">shrinking packet squares</text>
  <text class="label" x="750" y="1010">Coherent tower: r_j = lambda^j r_1</text>
  <text class="label" x="750" y="1030">Cross-scale: Theta &gt; rho_tower (OPEN)</text>
</svg>
